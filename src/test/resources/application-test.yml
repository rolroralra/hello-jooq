spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hellojooq
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  flyway:
    enabled: true
    locations: classpath:db/migration

  jooq:
    sql-dialect: POSTGRES

  docker:
    compose:
      enabled: false

logging:
  level:
    org.jooq.tools.LoggerListener: DEBUG
